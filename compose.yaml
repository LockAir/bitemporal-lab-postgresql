services:
  postgres:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_USER: diploma
      POSTGRES_PASSWORD: diploma
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "timezone=UTC"]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U diploma -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
